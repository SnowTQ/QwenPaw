name: Sync upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/agentscope-ai/QwenPaw.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || echo "No updates or merge conflict"
          git push origin main
